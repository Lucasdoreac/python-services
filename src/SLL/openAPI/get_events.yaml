swagger: "2.0"
info:
  version: "1.0.0"
  title: "API de Eventos"
  description: "Documentação da API para gerenciamento de eventos"
host: "127.0.0.1:5000"
basePath: "/"
schemes:
  - "http"
paths:
  /events:
    get:
      summary: "Obter todos os eventos"
      description: "Endpoint para recuperar todos os eventos registrados."
      operationId: "getAllEvents"
      produces:
        - "application/json"
      responses:
        200:
          description: "Lista de eventos retornada com sucesso"
          schema:
            type: "array"
            items:
              type: "object"
              properties:
                _id:
                  type: "string"
                  description: "ID do evento"
                  example: "66237a7e9407655e516eea70"
                name:
                  type: "string"
                  description: "Nome do evento"
                  example: "Event name"
                description:
                  type: "string"
                  description: "Descrição do evento"
                  example: "description"
                entrepreneuralPath:
                  type: "string"
                  description: "Caminho empreendedor relacionado ao evento"
                  example: "entrepreneuralPath"
                eventLogo:
                  type: "string"
                  description: "Logo do evento"
                  example: "eventLogo"
                eventTypeId:
                  type: "string"
                  description: "ID do tipo de evento"
                  example: "eventTypeId"
                expectedSubscribers:
                  type: "string"
                  description: "Número esperado de inscritos"
                  example: "expectedSubscribers"
                extensionProject:
                  type: "string"
                  description: "Projeto de extensão relacionado ao evento"
                  example: "extensionProject"
                graduationId:
                  type: "string"
                  description: "ID da graduação"
                  example: "graduationId"
                odsTypeId:
                  type: "string"
                  description: "ID do tipo de ODS"
                  example: "odsTypeId"
                organizer:
                  type: "object"
                  properties:
                    email:
                      type: "string"
                      description: "Email do organizador"
                      example: "guilherme.amaral2004@gmail.com"
                    id:
                      type: "integer"
                      description: "ID do organizador"
                      example: 999865850
                    name:
                      type: "string"
                      description: "Nome do organizador"
                      example: "guilherme"
                resources:
                  type: "string"
                  description: "Recursos necessários para o evento"
                  example: "resources"
                roomType:
                  type: "array"
                  description: "Tipos de salas disponíveis para o evento"
                  items:
                    type: "string"
                    example: "roomType"
                studentsMonitors:
                  type: "array"
                  description: "IDs dos monitores estudantes do evento"
                  items:
                    type: "integer"
                    example: 31891942
                subscriptionLink:
                  type: "string"
                  description: "Link para inscrição"
                  example: "subscriptionLink"
                targetPublic:
                  type: "string"
                  description: "Público alvo do evento"
                  example: "targetPublic"
        500:
          description: "Erro interno do servidor"
          schema:
            type: "object"
            properties:
              error:
                type: "string"
                description: "Mensagem de erro"
                example: "Erro interno do servidor"
