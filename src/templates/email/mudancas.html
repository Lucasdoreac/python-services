<!DOCTYPE html>
<html lang="pt-BR">
{% from "email/partials/brand_header.html" import branded_header %}
<head>
    <meta charset="UTF-8">
    <title>Requisitar edição</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f9f9f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #fff;
            border: 1px solid #ddd;
            padding: 20px;
            text-align: center;
        }
        .error { color: #b42318; }
    </style>
</head>
<body>
    <div class="container">
        {{ branded_header(logo_url, "Requisitar edição") }}
        <p>Informe as mudanças para retornar ao requisitante:</p>
        {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}

        <form action="/store_changes" method="post">
            <input type="hidden" name="eventId" value="{{ event_id }}">
            <input type="hidden" name="tokenId" value="{{ token_id }}">
            <label for="mudancas">Explique as mudanças:</label>
            <br>
            <textarea id="mudancas" name="mudancas" rows="4" cols="50" maxlength="{{ max_length }}" required
                      placeholder="Digite as mudanças aqui...">{{ mensagem }}</textarea>
            <br>
            <button type="submit" style="background-color: #28a745; border: none; border-radius: 25px; padding: 10px 40px; color: #fff; font-size: 16px;">Enviar</button>
        </form>
    </div>
</body>
</html>
