{% macro branded_header(logo_url, title, background="#0D5580") -%}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
        <td align="center" style="padding:12px 8px 18px;background-color:#ffffff;">
            <img src="{{ logo_url }}" width="240" height="63"
                 alt="DW Corp — You dream, we build"
                 style="display:block;width:240px;height:auto;max-width:100%;border:0;outline:none;text-decoration:none;" />
        </td>
    </tr>
    <tr>
        <td align="center" bgcolor="{{ background }}"
            style="padding:12px;background-color:{{ background }};color:#ffffff;font-family:Arial,sans-serif;">
            <h1 style="margin:0;font-size:22px;line-height:1.3;font-weight:bold;">{{ title }}</h1>
        </td>
    </tr>
</table>
{%- endmacro %}
