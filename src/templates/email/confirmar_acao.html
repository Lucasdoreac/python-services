<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirmar ação</title>
</head>
<body>
    <main>
        <h1>Confirmação da Coordenação/Reitoria</h1>
        <p>{{ who }}: confirme se deseja {{ action_label }}.</p>
        <form method="post" action="/{{ action }}">
            <input type="hidden" name="eventId" value="{{ event_id }}" />
            <input type="hidden" name="tokenId" value="{{ token_id }}" />
            {% if action == "request_changes" %}
            <label for="message">Descreva as alterações necessárias</label>
            <textarea id="message" name="message" rows="6" maxlength="1000" required>{{ message or "" }}</textarea>
            {% if error %}<p role="alert">{{ error }}</p>{% endif %}
            {% endif %}
            <button type="submit">Confirmar</button>
        </form>
    </main>
</body>
</html>
