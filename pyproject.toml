[tool.poetry]
name = "python-services"
version = "0.1.0"
description = ""
authors = ["GuiMcs00 <guilherme.amaral2004@gmail.com>"]
readme = "README.md"
packages = [
    {include = "src", from = "."},
    {include = "DAL", from = "src"},
    {include = "BLL", from = "src"},
    {include = "SLL", from="src"},
    {include = "DTO", from="src"}
]


[tool.poetry.dependencies]
python = "^3.14"
python-dotenv = "^1.2.3"
flask = "^3.1.3"
flask-cors = "^6.0.5"
requests = "^2.34.2"
pymongo = "^4.18.2"
flasgger = "^0.9.7.1"
typst = "^0.15.0"
minio = "^7.2.20"
gunicorn = "^26.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
mongomock = "^4.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
